<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>REDP2P Browser Tests</title>
    <style>
        html,body {
            background: #111;
            color: #ddd;
            font-family: monospace;
        }
        body {
            margin: 2rem;
            padding: 1rem;
        }

        h1 {
            color: #fff;
        }

        #output {
            white-space: pre-wrap;
        }

        .pass {
            color: #8f8;
        }

        .fail {
            color: #f88;
        }
    </style>
</head>
<body>
<h1>REDP2P Browser Tests</h1>
<div id="output"></div>

<script src="../imp/redp2p-pub.js"></script>
<script src="../imp/redp2p-con.js"></script>
<script>
"use strict";

(async () => {
    const output = document.getElementById("output");
    const params = new URLSearchParams(location.search);
    const index = params.get("index") || new URL("/index", location.href).href;
    const id = "browser" + crypto.getRandomValues(new Uint32Array(1))[0];

    let passed = 0;
    let failed = 0;
    let pub = null;
    let con = null;
    let publisherClient = null;
    let publisherInput = null;
    let consumerReplyResolve = null;

    function report(ok, name, detail = "") {
        const line = document.createElement("div");
        line.className = ok ? "pass" : "fail";
        line.textContent =
            `[${ok ? "PASS" : "FAIL"}] ${name}${detail ? ": " + detail : ""}`;
        output.appendChild(line);

        if (ok) {
            passed++;
        } else {
            failed++;
        }
    }

    async function test(name, callback) {
        try {
            await callback();
            report(true, name);
        } catch (error) {
            const detail = error && error.message ? error.message : String(error);
            report(false, name, detail);
            throw error;
        }
    }

    function assert(condition, message) {
        if (!condition) {
            throw new Error(message);
        }
    }

    async function withTimeout(promise, milliseconds, label) {
        let timer;
        const timeout = new Promise((resolve, reject) => {
            timer = setTimeout(() => reject(new Error(label)), milliseconds);
        });

        try {
            return await Promise.race([promise, timeout]);
        } finally {
            clearTimeout(timer);
        }
    }

    try {
        await test("browser capabilities", async () => {
            assert(typeof RTCPeerConnection === "function",
                "RTCPeerConnection unavailable");
            assert(globalThis.crypto && crypto.subtle,
                "Web Crypto unavailable");
            assert(typeof fetch === "function",
                "Fetch unavailable");
        });

        await test("index endpoint", async () => {
            const response = await fetch(index, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({version: 0, op: "list"}),
                cache: "no-store"
            });

            const body = await response.json();
            assert(response.ok, `HTTP ${response.status}`);
            assert(body && body.ok === true, body && body.error
                ? body.error
                : "invalid index response");
            assert(Array.isArray(body.ids), "index list missing ids");
        });

        await test("publisher register", async () => {
            pub = await RedP2P.pub({
                id,
                index,
                pollInterval: 100,
                connect(client) {
                    publisherClient = client;
                },
                receive(input) {
                    publisherInput = input;
                    if (input.data === "ping") {
                        input.client.respond("pong");
                    }
                }
            });

            assert(pub !== null, "publisher did not start");
        });

        await test("publisher lookup", async () => {
            const response = await fetch(index, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({version: 0, op: "lookup", id}),
                cache: "no-store"
            });

            const body = await response.json();
            assert(response.ok, `HTTP ${response.status}`);
            assert(body && body.ok === true, body && body.error
                ? body.error
                : "invalid lookup response");
            assert(body.id === id, "publisher id mismatch");
            assert(body.transport === "rtc", "publisher transport is not rtc");
        });

        await test("consumer connect", async () => {
            con = await RedP2P.con({
                id,
                index,
                pollInterval: 100,
                timeout: 15000,
                receive(data) {
                    if (consumerReplyResolve) {
                        const resolve = consumerReplyResolve;
                        consumerReplyResolve = null;
                        resolve(data);
                    }
                }
            });

            assert(con !== null, "consumer did not connect");
            assert(typeof con.send === "function", "consumer send unavailable");
            assert(typeof con.close === "function", "consumer close unavailable");
        });

        await test("consumer -> publisher", async () => {
            const received = new Promise(resolve => {
                const started = Date.now();
                const timer = setInterval(() => {
                    if (publisherInput !== null) {
                        clearInterval(timer);
                        resolve(publisherInput.data);
                        return;
                    }
                    if (Date.now() - started > 5000) {
                        clearInterval(timer);
                        resolve(null);
                    }
                }, 25);
            });

            con.send("ping");

            const data = await withTimeout(
                received,
                5500,
                "publisher receive timed out"
            );

            assert(data === "ping", "publisher received unexpected data");
            assert(publisherClient !== null,
                "publisher channel connect callback unavailable");
            assert(publisherInput && publisherInput.client === publisherClient,
                "publisher receive client differs from connected channel");
            assert(typeof publisherInput.client.respond === "function",
                "publisher client respond unavailable");
            assert(typeof publisherInput.client.close === "function",
                "publisher client close unavailable");
        });

        await test("publisher -> consumer", async () => {
            const reply = new Promise(resolve => {
                consumerReplyResolve = resolve;
            });

            publisherInput.client.respond("pong");

            const data = await withTimeout(
                reply,
                5000,
                "consumer receive timed out"
            );

            assert(data === "pong", "consumer received unexpected data");
        });

        await test("consumer close", async () => {
            con.close();
            con = null;
        });

        await test("publisher deregister", async () => {
            await pub.close();
            pub = null;

            const response = await fetch(index, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({version: 0, op: "lookup", id}),
                cache: "no-store"
            });

            const body = await response.json();
            assert(response.status === 404, `expected HTTP 404, got ${response.status}`);
            assert(body && body.error === "not_found",
                "publisher remained registered");
        });
    } catch (error) {
        if (con) {
            con.close();
            con = null;
        }

        if (pub && typeof pub.close === "function") {
            try {
                await pub.close();
            } catch (_) {
            }
            pub = null;
        }
    }

    const summary = document.createElement("div");
    summary.className = failed === 0 ? "pass" : "fail";
    summary.textContent = `\n${passed}/${passed + failed} passed`;
    output.appendChild(summary);

    document.title = failed === 0
        ? "PASS - REDP2P Browser Tests"
        : "FAIL - REDP2P Browser Tests";
})();
</script>
</body>
</html>
