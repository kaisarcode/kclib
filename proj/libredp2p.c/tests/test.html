<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REDP2P Web Peer Test</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 16px;
        }

        fieldset {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 4px;
        }

        input,
        select,
        button {
            font: inherit;
        }

        input,
        select {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
        }

        button {
            padding: 8px 14px;
        }

        #messages {
            min-height: 180px;
            padding: 10px;
            border: 1px solid #999;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        #message-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        #message {
            flex: 1;
        }

        #status {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>REDP2P Web Peer Test</h1>

    <fieldset>
        <legend>Peer</legend>

        <label for="index">Index URL</label>
        <input id="index" type="url">

        <label for="id">Publisher ID</label>
        <input id="id" value="test1" maxlength="63">

        <label for="password">Index password</label>
        <input id="password" type="text" autocomplete="current-password">

        <label for="role">Role</label>
        <select id="role">
            <option value="publisher">Publisher</option>
            <option value="consumer">Consumer</option>
        </select>

        <p>Status: <span id="status">stopped</span></p>
        <button id="start" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
    </fieldset>

    <fieldset>
        <legend>Messages</legend>
        <div id="messages"></div>
        <div id="message-row">
            <input id="message" autocomplete="off" placeholder="Message">
            <button id="send" type="button" disabled>Send</button>
        </div>
    </fieldset>

    <script src="../imp/js/redp2p.js"></script>
    <script src="../imp/js/redp2p-pub.js"></script>
    <script src="../imp/js/redp2p-con.js"></script>
    <script>
        "use strict";

        const indexInput = document.getElementById("index");
        const idInput = document.getElementById("id");
        const passwordInput = document.getElementById("password");
        const roleInput = document.getElementById("role");
        const statusNode = document.getElementById("status");
        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");
        const sendButton = document.getElementById("send");
        const messageInput = document.getElementById("message");
        const messagesNode = document.getElementById("messages");

        const clients = new Set();
        let publisher = null;
        let consumer = null;

        indexInput.value = new URL(
            "index.php",
            window.location.href
        ).href;

        function setStatus(value) {
            statusNode.textContent = value;
        }

        function log(prefix, value) {
            const line = document.createElement("div");
            line.textContent = `${prefix}: ${value}`;
            messagesNode.appendChild(line);
            messagesNode.scrollTop = messagesNode.scrollHeight;
        }

        function messageText(data) {
            if (typeof data === "string") {
                return data;
            }
            if (data instanceof ArrayBuffer) {
                return new TextDecoder().decode(new Uint8Array(data));
            }
            if (ArrayBuffer.isView(data)) {
                return new TextDecoder().decode(
                    new Uint8Array(data.buffer, data.byteOffset, data.byteLength)
                );
            }
            return String(data);
        }

        function updateSendState() {
            sendButton.disabled = consumer === null && clients.size === 0;
        }

        async function stop() {
            const currentPublisher = publisher;
            const currentConsumer = consumer;
            publisher = null;
            consumer = null;

            for (const client of clients) {
                try {
                    client.close();
                } catch (error) {
                    log("error", error.message || error);
                }
            }
            clients.clear();

            if (currentConsumer) {
                currentConsumer.close();
            }
            if (currentPublisher) {
                await currentPublisher.close();
            }

            startButton.disabled = false;
            stopButton.disabled = true;
            indexInput.disabled = false;
            idInput.disabled = false;
            passwordInput.disabled = false;
            roleInput.disabled = false;
            updateSendState();
            setStatus("stopped");
        }

        async function startPublisher(index, id, pass) {
            publisher = await RedP2P.pub({
                index,
                id,
                pass,
                connect(client) {
                    clients.add(client);
                    setStatus("publisher connected");
                    log("system", "consumer connected");
                    updateSendState();
                },
                receive(event) {
                    log("consumer", messageText(event.data));
                },
                disconnect(client) {
                    clients.delete(client);
                    setStatus("publisher waiting");
                    log("system", "consumer disconnected");
                    updateSendState();
                },
                error(error, client) {
                    if (client) {
                        clients.delete(client);
                    }
                    log("error", error.message || error);
                    updateSendState();
                }
            });
            setStatus("publisher waiting");
        }

        async function startConsumer(index, id) {
            consumer = await RedP2P.con({
                index,
                id,
                receive(data) {
                    log("publisher", messageText(data));
                },
                disconnect() {
                    consumer = null;
                    setStatus("consumer disconnected");
                    log("system", "publisher disconnected");
                    updateSendState();
                },
                error(error) {
                    log("error", error.message || error);
                }
            });
            setStatus("consumer connected");
            log("system", "connected to publisher");
            updateSendState();
        }

        startButton.addEventListener("click", async () => {
            const index = indexInput.value.trim();
            const id = idInput.value.trim();
            const pass = passwordInput.value;
            const role = roleInput.value;

            startButton.disabled = true;
            indexInput.disabled = true;
            idInput.disabled = true;
            passwordInput.disabled = true;
            roleInput.disabled = true;
            setStatus("starting");

            try {
                if (role === "publisher") {
                    await startPublisher(index, id, pass);
                } else {
                    await startConsumer(index, id);
                }
                stopButton.disabled = false;
            } catch (error) {
                log("error", error.message || error);
                setStatus("failed");
                startButton.disabled = false;
                indexInput.disabled = false;
                idInput.disabled = false;
                passwordInput.disabled = false;
                roleInput.disabled = false;
            }
        });

        stopButton.addEventListener("click", () => {
            stop().catch(error => log("error", error.message || error));
        });

        function sendMessage() {
            const message = messageInput.value;
            if (message === "") {
                return;
            }

            try {
                if (consumer) {
                    consumer.send(message);
                } else {
                    for (const client of clients) {
                        client.respond(message);
                    }
                }
                log("me", message);
                messageInput.value = "";
                messageInput.focus();
            } catch (error) {
                log("error", error.message || error);
            }
        }

        sendButton.addEventListener("click", sendMessage);
        messageInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
