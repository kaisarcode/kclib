name: REDP2P namespace normalization

on:
  push:
    branches:
      - devel
    paths:
      - .github/workflows/redp2p-namespace-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out devel
        uses: actions/checkout@v4
        with:
          ref: devel
          fetch-depth: 0

      - name: Normalize REDP2P namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("proj/libredp2p.c")
          vendor = root / "lib"
          changed = []

          for path in root.rglob("*"):
              if not path.is_file() or vendor in path.parents:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              new = text.replace("KC_REDP2P_", "REDP2P_")
              new = new.replace("kc_redp2p_", "redp2p_")
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))

          api_path = root / "src/libredp2p-api.c"
          api = api_path.read_text(encoding="utf-8")

          decl = "static void redp2p_sleep_tick(void);\nstatic uint64_t redp2p_now_ms(void);\n"
          if decl not in api:
              raise SystemExit("expected duplicate redp2p_now_ms declaration not found")
          api = api.replace(decl, "static void redp2p_sleep_tick(void);\n", 1)

          now_marker = "/**\n * Returns a monotonic millisecond timestamp.\n * @return Monotonic milliseconds.\n */\nstatic uint64_t redp2p_now_ms(void)\n"
          now_start = api.find(now_marker)
          if now_start < 0:
              raise SystemExit("expected duplicate redp2p_now_ms definition not found")
          next_comment = api.find("/**\n", now_start + len(now_marker))
          if next_comment < 0:
              raise SystemExit("could not locate end of duplicate redp2p_now_ms definition")
          api = api[:now_start] + api[next_comment:]

          version_marker = "/**\n * Returns the build version of the public library.\n * @return Build version value.\n */\nuint64_t redp2p_version(void)\n"
          version_start = api.find(version_marker)
          if version_start < 0:
              raise SystemExit("expected duplicate redp2p_version wrapper not found")
          tail = api[version_start:]
          if "return redp2p_version();" not in tail:
              raise SystemExit("unexpected redp2p_version wrapper body")
          api = api[:version_start].rstrip() + "\n"
          api_path.write_text(api, encoding="utf-8")
          if str(api_path) not in changed:
              changed.append(str(api_path))

          leftovers = []
          for path in root.rglob("*"):
              if not path.is_file() or vendor in path.parents:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "kc_redp2p_" in text or "KC_REDP2P_" in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit("old REDP2P namespace remains in: " + ", ".join(leftovers))

          print("normalized files:")
          for path in changed:
              print(path)
          PY

      - name: Test libredp2p
        working-directory: proj/libredp2p.c
        run: |
          set -euo pipefail
          make
          make test

      - name: Commit normalized namespace
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/redp2p-namespace-once.yml
          git config user.name "KaisarCode Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Normalize libredp2p namespace"
          git push origin HEAD:devel
